# ==============================================================================
# Scraper.co.in - Production Docker Compose Stack (Zero-Chromium)
# Services: Python TLS Sidecar (:5003) + Node/Go Engine (:5002) + Client + Master
# ==============================================================================

services:
  scraper-tls-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: scraper-tls-sidecar
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 96M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5003/health"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 8s

  scraper-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: scraper-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - COMPUTE_MODE=hybrid
      - TLS_SIDECAR_URL=http://scraper-tls-sidecar:5003
      - STORAGE_ROOT=/storage
      - SANDBOX_USER_ID=prod_shared
      - NODE_OPTIONS=--max-old-space-size=1024
      - AUTH_REQUIRED=1
      - SESSION_SECRET=${SESSION_SECRET:-scraper-production-secure-session-secret-change-me}
      - MASTER_KEY=${MASTER_KEY:-master-admin-production-key-change-me}
    depends_on:
      scraper-tls-sidecar:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 128M
    volumes:
      - scraper_storage:/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5002/api/health"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s

  scraper-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: scraper-client
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - API_UPSTREAM=http://scraper-server:5002
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      scraper-server:
        condition: service_healthy

  scraper-master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: scraper-master
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - API_UPSTREAM=http://scraper-server:5002
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      scraper-server:
        condition: service_healthy

volumes:
  scraper_storage:
    name: scraper_production_storage
