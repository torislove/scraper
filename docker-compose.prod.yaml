# ==============================================================================
# Scraper.co.in - Production Docker Compose Orchestration
# Ultra-Slim Resource Footprint with Client-Hardware Distributed Compute
# ==============================================================================

services:
  scraper-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: scraper-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - COMPUTE_MODE=extension_only
      - SCRAPER_EXTENSION_ONLY=true
      - USER_RAM_OFFLOAD_ENABLED=1
      - SCRAPER_ALLOW_REMOTE=1
      - SCRAPER_BROWSER_SLOTS=0
      - PLAYWRIGHT_CONCURRENCY=0
      - NODE_OPTIONS=--max-old-space-size=1024
      - AUTH_REQUIRED=1
      - SESSION_SECRET=${SESSION_SECRET:-scraper-production-secure-session-secret-change-me}
      - MASTER_KEY=${MASTER_KEY:-master-admin-production-key-change-me}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Persistent storage for vaults, lead database, and users
      - scraper_data:/app/server/data
      - scraper_db:/app/server/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s

  scraper-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: scraper-client
    restart: unless-stopped
    ports:
      - "8081:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      scraper-server:
        condition: service_healthy

  scraper-master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: scraper-master
    restart: unless-stopped
    ports:
      - "8082:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      scraper-server:
        condition: service_healthy

volumes:
  scraper_data:
    name: scraper_production_data
  scraper_db:
    name: scraper_production_db
