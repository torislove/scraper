services:
  scraper-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: scraper-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - COMPUTE_MODE=user_ram_hybrid
      - USER_RAM_OFFLOAD_ENABLED=1
      - SCRAPER_ALLOW_REMOTE=1
      - SCRAPER_BROWSER_SLOTS=auto
      - PLAYWRIGHT_CONCURRENCY=auto
      - NODE_OPTIONS=--max-old-space-size=2560
      - AUTH_REQUIRED=1
      - SESSION_SECRET=${SESSION_SECRET:-scraper-super-secure-session-secret-change-me}
      - MASTER_KEY=${MASTER_KEY:-master-admin-secret-key-change-me}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 384M
    volumes:
      # Persistent storage for vaults, lead database, and users
      - scraper_data:/app/server/data
      - scraper_db:/app/server/db
    shm_size: "1gb" # Essential: Chromium requires >=1GB shared memory to avoid crashes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scraper-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: scraper-client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      scraper-server:
        condition: service_healthy

  scraper-master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: scraper-master
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      scraper-server:
        condition: service_healthy

volumes:
  scraper_data:
    name: scraper_production_data
  scraper_db:
    name: scraper_production_db
