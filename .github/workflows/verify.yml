name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  client-ci:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Client ESLint check
        working-directory: client
        run: |
          npx eslint src/ --rule "no-undef: error" --rule "no-empty: off" --quiet

      - name: Client production build
        run: npm run build --prefix client

  master-ci:
    name: Master Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: master/package-lock.json

      - name: Install Master dependencies
        run: |
          npm install --prefix client --no-audit --no-fund
          npm install --prefix master --no-audit --no-fund

      - name: Master ESLint check
        working-directory: master
        run: |
          npx eslint src/ --rule "no-undef: error" --rule "no-empty: off" --quiet

      - name: Master production build
        run: npm run build --prefix master

  admin-ci:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin dependencies
        run: npm install --prefix admin --no-audit --no-fund

      - name: Admin production build
        run: npm run build --prefix admin

  server-ci:
    name: Server & Config Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Validate Firebase & Package JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.firebaserc','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Install Server production dependencies
        run: npm install --prefix server --omit=dev --no-audit --no-fund

      - name: Server syntax check
        run: |
          node --check server/index.js
          node --check server/server.js
          node --check server/src/auth.js
          node --check server/src/orchestrator.js
          node --check server/src/store.js
          node --check server/src/geo.js
          node --check server/src/taxonomy.js
          node --check server/src/sse.js
          node --check server/src/folderStore.js
          node --check server/src/master/adminRegistry.js
          node --check server/src/master/masterOrchestrator.js
          node --check server/src/master/masterRoutes.js
          node --check server/src/engines/contract.js
          node --check server/src/engines/phoneUtils.js
          node --check server/src/engines/tlsSidecar/index.js
          node --check server/src/engines/gmapDirect/index.js
          node --check server/src/engines/osmPoi/index.js
          node --check server/src/engines/gosom/index.js
          node --check server/src/engines/lightpanda/index.js
          node --check server/src/engines/serp/index.js
          node --check server/src/engines/socialDork/index.js
          node --check server/src/services/leadEnricher.js
          node --check server/src/services/addressParser.js
          node --check server/src/services/concurrency.js
          node --check server/src/services/goldenMerger.js
          node --check server/src/services/hardwareSafety.js

      - name: Full server source tree recursive syntax check
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          function walk(dir) {
            let files = [];
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) {
                if (item.name !== 'node_modules' && item.name !== 'bin') files.push(...walk(full));
              } else if (item.name.endsWith('.js')) {
                files.push(full);
              }
            }
            return files;
          }
          const all = walk('server/src');
          console.log('Verifying ' + all.length + ' server modules for syntax validity...');
          for (const f of all) {
            execSync('node --check ' + f, { stdio: 'inherit' });
          }
          console.log('All ' + all.length + ' server modules passed syntax check cleanly.');
          "

      - name: Run Precision Benchmark & Cross-Sector Leakage Verification
        run: node scripts/verify/precision-benchmark.test.cjs

      - name: Optional Desktop syntax check
        run: |
          if [ -f desktop/src/main.js ]; then
            node --check desktop/src/main.js
            node --check desktop/src/preload.js
          fi
