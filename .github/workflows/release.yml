name: release-artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as draft release"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: release-artifacts
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package-release:
    name: Package Web & Browser Extensions
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install & build Client bundle
        run: |
          npm install --prefix client --no-audit --no-fund
          npm run build --prefix client

      - name: Package Chrome, Edge & Firefox Extensions
        run: node scripts/package-extension.cjs

      - name: Optional Desktop Installer Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPER_LICENSE_API: ${{ vars.SCRAPER_LICENSE_API }}
          SCRAPER_CHECKOUT_URL: ${{ vars.SCRAPER_CHECKOUT_URL }}
        run: |
          if (Test-Path "desktop/package.json") {
            npm install --prefix server --omit=dev --no-audit --no-fund
            npm install --prefix desktop --no-audit --no-fund
            npm run release --prefix desktop
          } else {
            Write-Host "Desktop shell not present in repo; packaged cross-browser extensions cleanly."
          }

      - name: Upload Extension & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraper-release-bundles
          path: |
            dist/extensions/*.zip
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: warn
          retention-days: 30
