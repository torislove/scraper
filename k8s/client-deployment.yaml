apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-client
  namespace: scraper-prod
  labels:
    app: scraper-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scraper-client
  template:
    metadata:
      labels:
        app: scraper-client
    spec:
      containers:
        - name: client
          image: ghcr.io/scraper-coin/scraper-client:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: API_UPSTREAM
              value: "http://scraper-server-service:5002"
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-client-service
  namespace: scraper-prod
  labels:
    app: scraper-client
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: scraper-client
