apiVersion: v1
kind: ConfigMap
metadata:
  name: scraper-config
  namespace: scraper-prod
data:
  PORT: "5002"
  NODE_ENV: "production"
  SCRAPER_ALLOW_REMOTE: "1"
  PLAYWRIGHT_CONCURRENCY: "4"
  AUTH_REQUIRED: "1"
  SESSION_TTL_SECONDS: "604800"
  MAX_PARALLEL_JOBS: "25"
  CLIENT_MAX_CONCURRENT_JOBS: "2"
  SWEEP_POOL_SHARE: "0.4"
