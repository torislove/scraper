apiVersion: v1
kind: ConfigMap
metadata:
  name: scraper-config
  namespace: scraper-prod
data:
  PORT: "5002"
  NODE_ENV: "production"
  COMPUTE_MODE: "user_ram_hybrid"
  USER_RAM_OFFLOAD_ENABLED: "1"
  SCRAPER_ALLOW_REMOTE: "1"
  # Auto-scales concurrency by host/pod memory when running coordinator or local worker,
  # while client browser Web Workers offload discovery & dedupe onto user RAM.
  SCRAPER_BROWSER_SLOTS: "auto"
  SCRAPER_ENRICH_RESERVE: "1"
  PLAYWRIGHT_CONCURRENCY: "auto"
  NODE_OPTIONS: "--max-old-space-size=1536"
  AUTH_REQUIRED: "1"
  SESSION_TTL_SECONDS: "604800"
  MAX_PARALLEL_JOBS: "25"
  CLIENT_MAX_CONCURRENT_JOBS: "2"
  SWEEP_POOL_SHARE: "0.4"
