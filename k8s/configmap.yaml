apiVersion: v1
kind: ConfigMap
metadata:
  name: scraper-config
  namespace: scraper-prod
data:
  PORT: "5002"
  NODE_ENV: "production"
  COMPUTE_MODE: "hybrid"
  TLS_SIDECAR_URL: "http://127.0.0.1:5003"
  STORAGE_ROOT: "/storage"
  SANDBOX_USER_ID: "prod_shared"
  USER_RAM_OFFLOAD_ENABLED: "1"
  SCRAPER_ALLOW_REMOTE: "1"
  NODE_OPTIONS: "--max-old-space-size=1536"
  AUTH_REQUIRED: "1"
  SESSION_TTL_SECONDS: "604800"
  MAX_PARALLEL_JOBS: "25"
  CLIENT_MAX_CONCURRENT_JOBS: "2"
