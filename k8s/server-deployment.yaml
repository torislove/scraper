apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-server
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scraper-server
  template:
    metadata:
      labels:
        app: scraper-server
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/scraper-coin/scraper-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: scraper-config
            - secretRef:
                name: scraper-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "1200m"
              memory: "1024Mi"
          volumeMounts:
            - name: storage
              mountPath: /storage
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 4
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
        - name: tls-sidecar
          image: ghcr.io/scraper-coin/scraper-sidecar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: sidecar
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 8
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 4
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: scraper-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-server-service
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: scraper-server
