apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-server
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scraper-server
  template:
    metadata:
      labels:
        app: scraper-server
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/scraper-coin/scraper-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: scraper-config
            - secretRef:
                name: scraper-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            # Zero-Server Distributed Compute:
            # Client browser Web Workers & RAM Turbo extension offload 95%+ of RAM/CPU
            # onto client PC hardware, allowing the pod to operate efficiently on <128Mi.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: storage
              mountPath: /app/server/db
              subPath: db
            - name: storage
              mountPath: /app/server/data
              subPath: data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: scraper-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-server-service
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: scraper-server
