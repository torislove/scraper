apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-server
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  # ONE replica, on purpose.
  #
  # Every run's state lives in this process (activeSessions, sessionAbortSignals),
  # leads are written to data/scraped_vendors.json through a single-writer
  # .store.lock, and SSE streams are held in memory. A second pod would either
  # fail to mount this ReadWriteOnce volume or fight the first one for the lock
  # and lose leads.
  #
  # One pod is not one scrape: the in-process queue runs ~6 browser slots and
  # ~8 HTTP slots at once, so many users can scrape concurrently on this pod.
  #
  # Scale past one replica only after Phase 2 of docs/DEPLOYMENT-PLAN.md
  # (Postgres + Redis + one Kubernetes Job per scrape). Until then, raise
  # PLAYWRIGHT_CONCURRENCY / the CPU limit instead of replicas.
  replicas: 1
  # Recreate, never RollingUpdate: a rolling update briefly runs two pods, and
  # two pods means two writers on the same JSON store.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scraper-server
  template:
    metadata:
      labels:
        app: scraper-server
    spec:
      # Give an in-flight scrape a moment to flush leads and the queue to disk
      # before the pod is killed.
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: ghcr.io/scraper-coin/scraper-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: scraper-config
            - secretRef:
                name: scraper-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              # 4 vCPU / 4 GiB matches SCRAPER_BROWSER_SLOTS=4 in the ConfigMap.
              # Raising one without the other causes either OOM kills or idle CPU.
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            # Crucial: Chromium requires shared memory (/dev/shm) to prevent crashes on high-concurrency tabs
            - name: dshm
              mountPath: /dev/shm
            - name: storage
              mountPath: /app/server/db
              subPath: db
            - name: storage
              mountPath: /app/server/data
              subPath: data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: storage
          persistentVolumeClaim:
            claimName: scraper-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-server-service
  namespace: scraper-prod
  labels:
    app: scraper-server
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: scraper-server
