apiVersion: v1
kind: Secret
metadata:
  name: scraper-secrets
  namespace: scraper-prod
type: Opaque
stringData:
  # Replace with a cryptographically random string (e.g. openssl rand -hex 32)
  SESSION_SECRET: "change-this-to-a-secure-random-32-byte-hex-secret"
  MASTER_KEY: "change-this-to-a-secure-admin-master-key"
