apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scraper-ingress
  namespace: scraper-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Essential for SSE real-time radar and lead streaming without buffering
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - app.scraper.co.in
        - master.scraper.co.in
        - api.scraper.co.in
      secretName: scraper-tls-certs
  rules:
    # 1. Client SaaS Host
    - host: app.scraper.co.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scraper-server-service
                port:
                  number: 5002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scraper-client-service
                port:
                  number: 80

    # 2. Master Admin Control Room Host
    - host: master.scraper.co.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scraper-server-service
                port:
                  number: 5002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scraper-master-service
                port:
                  number: 80

    # 3. Direct API Subdomain Host
    - host: api.scraper.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scraper-server-service
                port:
                  number: 5002
