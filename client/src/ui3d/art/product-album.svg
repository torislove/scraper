<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="Velvet matte wedding album">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1026"/>
      <stop offset="0.55" stop-color="#241030"/>
      <stop offset="1" stop-color="#120b1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#f5c86a" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#b06ab3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b1f3a"/>
      <stop offset="0.5" stop-color="#7a2a4c"/>
      <stop offset="1" stop-color="#3d1329"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e7"/>
      <stop offset="1" stop-color="#d9c9ab"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7ab"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5f16"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="220" fill="url(#bg)"/>
  <rect width="600" height="220" fill="url(#glow)"/>

  <!-- table shadow -->
  <ellipse cx="310" cy="196" rx="215" ry="18" fill="#000" opacity="0.55"/>

  <!-- page block behind -->
  <g transform="rotate(-7 300 120)">
    <rect x="152" y="66" width="300" height="132" rx="7" fill="url(#page)"/>
    <rect x="158" y="72" width="288" height="120" rx="5" fill="#fffaf0" opacity="0.55"/>
    <g stroke="#c9b48c" stroke-width="1" opacity="0.55">
      <line x1="166" y1="90" x2="438" y2="90"/>
      <line x1="166" y1="104" x2="438" y2="104"/>
      <line x1="166" y1="118" x2="438" y2="118"/>
      <line x1="166" y1="132" x2="438" y2="132"/>
      <line x1="166" y1="146" x2="438" y2="146"/>
      <line x1="166" y1="160" x2="438" y2="160"/>
      <line x1="166" y1="174" x2="438" y2="174"/>
    </g>
  </g>

  <!-- second album -->
  <g transform="rotate(5 300 130)">
    <rect x="196" y="86" width="286" height="118" rx="8" fill="#2a0f22" stroke="#4b1c38" stroke-width="1.5"/>
    <rect x="204" y="94" width="270" height="102" rx="5" fill="url(#cover)"/>
    <rect x="214" y="104" width="250" height="82" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.9"/>
    <rect x="220" y="110" width="238" height="70" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.7" opacity="0.55"/>
    <circle cx="339" cy="145" r="17" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>
    <path d="M339 133 l5.6 11.4 12.6 1.8 -9.1 8.9 2.1 12.5 -11.2 -5.9 -11.2 5.9 2.1 -12.5 -9.1 -8.9 12.6 -1.8z" fill="url(#gold)" opacity="0.55"/>
    <rect x="204" y="94" width="270" height="102" rx="5" fill="url(#shade)" opacity="0.35"/>
  </g>

  <!-- front album -->
  <g transform="rotate(-2 300 130)">
    <rect x="228" y="70" width="296" height="128" rx="9" fill="#1d0a16"/>
    <rect x="234" y="76" width="284" height="116" rx="6" fill="url(#cover)"/>
    <rect x="243" y="85" width="266" height="98" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <rect x="249" y="91" width="254" height="86" rx="3" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.6"/>
    <!-- embossed motif -->
    <g transform="translate(376 126)" opacity="0.95">
      <circle r="20" fill="none" stroke="url(#gold)" stroke-width="1.1"/>
      <path d="M0 -14 L4.6 -4.6 L14 0 L4.6 4.6 L0 14 L-4.6 4.6 L-14 0 L-4.6 -4.6 Z" fill="url(#gold)" opacity="0.8"/>
      <circle r="2.4" fill="#2a0f22"/>
    </g>
    <text x="258" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3.2" fill="#e9cd93" opacity="0.9">VELVET</text>
    <text x="258" y="129" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" letter-spacing="2.6" fill="#c9a765" opacity="0.75">MATTE · 12 × 36</text>
    <rect x="234" y="76" width="284" height="116" rx="6" fill="url(#shade)" opacity="0.18"/>
  </g>

  <!-- spine highlights -->
  <rect x="228" y="70" width="4" height="128" rx="2" fill="#ffd9a0" opacity="0.22"/>
  <rect x="228" y="70" width="296" height="3" rx="1.5" fill="#ffe7b8" opacity="0.20"/>

  <!-- dust motes -->
  <g fill="#ffe4b0">
    <circle cx="120" cy="60" r="1.6" opacity="0.5"/>
    <circle cx="508" cy="48" r="1.2" opacity="0.4"/>
    <circle cx="470" cy="186" r="1.8" opacity="0.3"/>
    <circle cx="92" cy="168" r="1.1" opacity="0.35"/>
    <circle cx="540" cy="120" r="1.4" opacity="0.25"/>
  </g>
</svg>
