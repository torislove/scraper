<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradients -->
    <linearGradient id="favArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="favVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Embedded CSS Animation for Live Browser Tab Action -->
    <style>
      @keyframes pickaxeStrike {
        0%, 100% { transform: rotate(-25deg); }
        35% { transform: rotate(-55deg); }
        55% { transform: rotate(35deg); }
        70% { transform: rotate(20deg); }
      }
      @keyframes sparkBurst {
        0%, 50% { opacity: 0; transform: scale(0.4) translate(0, 0); }
        60% { opacity: 1; transform: scale(1.3) translate(-2px, -4px); }
        100% { opacity: 0; transform: scale(0.2) translate(-4px, -8px); }
      }
      @keyframes sparkBurst2 {
        0%, 50% { opacity: 0; transform: scale(0.4) translate(0, 0); }
        60% { opacity: 1; transform: scale(1.4) translate(3px, -5px); }
        100% { opacity: 0; transform: scale(0.2) translate(6px, -9px); }
      }
      @keyframes visorSweep {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes diggyBob {
        0%, 100% { transform: translateY(0); }
        35% { transform: translateY(-1.5px); }
        55% { transform: translateY(1.5px); }
      }
      .anim-pickaxe {
        transform-origin: 44px 28px;
        animation: pickaxeStrike 0.85s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .anim-spark-1 {
        animation: sparkBurst 0.85s infinite ease-out;
      }
      .anim-spark-2 {
        animation: sparkBurst2 0.85s infinite ease-out;
      }
      .anim-visor {
        animation: visorSweep 1.6s infinite ease-in-out;
      }
      .anim-body {
        animation: diggyBob 0.85s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Dark Obsidian Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#0a0f1d" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Ground excavation & gold sparks -->
  <ellipse cx="32" cy="54" rx="16" ry="3" fill="rgba(245, 158, 11, 0.3)"/>
  <path d="M26 53 L32 55 L38 53" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Sparks Flying from Strike -->
  <circle cx="27" cy="48" r="1.8" fill="#fef08a" class="anim-spark-1"/>
  <circle cx="37" cy="46" r="2" fill="#fbbf24" class="anim-spark-2"/>
  <circle cx="32" cy="44" r="1.2" fill="#38bdf8" class="anim-spark-1"/>

  <!-- Diggy Character Body -->
  <g class="anim-body">
    <!-- Legs -->
    <rect x="25" y="44" width="4.5" height="8" rx="2" fill="#1e293b"/>
    <rect x="34.5" y="44" width="4.5" height="8" rx="2" fill="#1e293b"/>
    <rect x="23" y="50" width="7" height="4" rx="2" fill="#0284c7"/>
    <rect x="34" y="50" width="7" height="4" rx="2" fill="#0284c7"/>

    <!-- Jetpack on back -->
    <rect x="18" y="27" width="5" height="13" rx="2.5" fill="#1e293b" stroke="#00f0ff" stroke-width="0.8"/>
    <ellipse cx="20.5" cy="41" rx="1.8" ry="3.5" fill="#38bdf8"/>

    <!-- Armored Torso -->
    <rect x="22" y="25" width="20" height="20" rx="6" fill="url(#favArmor)" stroke="#00f0ff" stroke-width="1.2"/>
    <circle cx="32" cy="35" r="4.2" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>
    <circle cx="32" cy="35" r="2.4" fill="#10b981"/>

    <!-- Head & Helmet -->
    <rect x="20" y="10" width="24" height="17" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
    
    <!-- Antenna Beacon -->
    <line x1="32" y1="10" x2="32" y2="4" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="4" r="2" fill="#10b981"/>

    <!-- Glowing Cyber Visor -->
    <rect x="23" y="14" width="18" height="9" rx="4.5" fill="url(#favVisor)" stroke="#00f0ff" stroke-width="0.8"/>
    
    <!-- Big Expressive Cyber Eyes inside Visor -->
    <circle cx="28" cy="18.5" r="2" fill="#ffffff" class="anim-visor"/>
    <circle cx="36" cy="18.5" r="2" fill="#ffffff" class="anim-visor"/>
  </g>

  <!-- Golden Energy Pickaxe & Swinging Arm -->
  <g class="anim-pickaxe">
    <!-- Pickaxe Handle -->
    <rect x="42" y="18" width="2.4" height="24" rx="1.2" fill="#94a3b8" transform="rotate(-30 42 18)"/>
    <!-- Glowing Golden Pickaxe Head -->
    <path d="M30 14 C38 18, 48 18, 56 12 C51 22, 42 22, 30 14 Z" fill="url(#favGold)" stroke="#fef08a" stroke-width="0.8"/>
    <circle cx="31" cy="14" r="1.5" fill="#ffffff"/>
  </g>
</svg>

