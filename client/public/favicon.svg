<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Luxury 3D Emerald Gradient -->
    <linearGradient id="scFavEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 3D Glass Surface Highlight -->
    <linearGradient id="scFavHl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Elevation Shadow -->
    <filter id="scFavShd" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#059669" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 3D Beveled Emerald Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#scFavEmerald)" filter="url(#scFavShd)" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#047857" stroke-width="1.5" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none" stroke="url(#scFavHl)" stroke-width="1.5" />

  <!-- High-Velocity "S" Monogram in Optic White -->
  <path
    d="M43 20 C43 14.8 38.5 13 32 13 C21.5 13 16.5 18 16.5 24.5 C16.5 33 35.5 30.5 35.5 37.5 C35.5 43.5 30 46.5 23 46.5 C16.5 46.5 12.5 42.5 12.5 37.5"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Forward Velocity Cyan Vector Spark -->
  <path
    d="M37 36 L44 43.5 L37 51"
    fill="none"
    stroke="#67E8F9"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Live Radar Beacon Jewel with Concentric Optical Highlight -->
  <circle cx="45" cy="18" r="4.8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="45" cy="18" r="2.2" fill="#FFFFFF" />
</svg>
