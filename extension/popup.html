<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scraper.co.in RAM Turbo Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(155deg, #6d28d9, #06b6d4 58%, #10b981);
      padding: 8px;
      color: #0f172a;
    }
    .bezel {
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.94));
      border: 1.5px solid #ffffff;
      padding: 14px;
      box-shadow: inset 0 2px 0 #ffffff, 0 12px 26px rgba(15, 23, 42, 0.28);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }
    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      flex-shrink: 0;
    }
    .kicker {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.07em;
      color: #6d28d9;
      text-transform: uppercase;
    }
    h1 {
      margin: 1px 0 0;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }
    .pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #065f46;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat {
      padding: 8px 9px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .stat span {
      display: block;
      font-size: 9px;
      font-weight: 800;
      color: #64748b;
    }
    .stat b {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
    }
    .note {
      font-size: 10.5px;
      line-height: 1.45;
      color: #475569;
      background: #f5f3ff;
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      height: 36px;
      border: 1.5px solid #047857;
      border-radius: 999px;
      background: linear-gradient(135deg, #059669, #10b981 55%, #06b6d4);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 3px 0 #065f46;
    }
  </style>
</head>
<body>
  <div class="bezel">
    <div class="head">
      <span class="led"></span>
      <div>
        <div class="kicker">Scraper.co.in · Zero-Knowledge Relay</div>
        <h1>RAM Turbo Bridge v1.0.0</h1>
      </div>
    </div>

    <div class="pill">
      <span>STATUS</span>
      <span id="ext-status">CONNECTED · READY</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span>YOUR HARDWARE</span>
        <b id="hw-spec">Detecting...</b>
      </div>
      <div class="stat">
        <span>TASKS RELAYED</span>
        <b id="relay-count">0</b>
      </div>
    </div>

    <div class="note">
      <strong>100% Cloud-Protected Engines:</strong> All 6 scraping &amp; deduplication engines run privately on Scraper.co.in servers. This bridge only uses your idle RAM when you run a search.
    </div>

    <button id="open-cmd" class="btn" type="button">Open Scraper.co.in Workspace →</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
