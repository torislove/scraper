<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="Wholesale cartons and B2B supply">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141c"/>
      <stop offset="0.55" stop-color="#0c2230"/>
      <stop offset="1" stop-color="#061019"/>
    </linearGradient>
    <radialGradient id="key" cx="0.18" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c48a"/>
      <stop offset="1" stop-color="#c98d4c"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b87c3f"/>
      <stop offset="1" stop-color="#8d5a28"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5626"/>
      <stop offset="1" stop-color="#5f3a17"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d9c2"/>
      <stop offset="1" stop-color="#bda88b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2230" stop-opacity="0"/>
      <stop offset="1" stop-color="#061019" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="220" fill="url(#bg)"/>
  <rect width="600" height="220" fill="url(#key)"/>

  <!-- perspective floor -->
  <g stroke="#1e4a5e" stroke-width="1" opacity="0.35">
    <line x1="0" y1="220" x2="220" y2="150"/>
    <line x1="120" y1="220" x2="280" y2="150"/>
    <line x1="260" y1="220" x2="345" y2="150"/>
    <line x1="420" y1="220" x2="415" y2="150"/>
    <line x1="600" y1="220" x2="490" y2="150"/>
    <line x1="0" y1="182" x2="600" y2="182"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
  </g>

  <!-- contact shadows -->
  <ellipse cx="270" cy="192" rx="160" ry="14" fill="#000" opacity="0.55"/>
  <ellipse cx="470" cy="186" rx="90" ry="10" fill="#000" opacity="0.5"/>

  <!-- back box -->
  <g>
    <path d="M352 118 L408 92 L464 118 L464 170 L408 196 L352 170 Z" fill="url(#boxLeft)" opacity="0.85"/>
    <path d="M408 92 L464 118 L464 170 L408 144 Z" fill="url(#boxRight)"/>
    <path d="M352 118 L408 92 L464 118 L408 144 Z" fill="url(#boxTop)"/>
    <path d="M408 92 L408 144" stroke="url(#tape)" stroke-width="7" opacity="0.8"/>
    <path d="M408 92 L464 118" stroke="#000" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- front box -->
  <g>
    <path d="M148 130 L212 100 L276 130 L276 192 L212 222 L148 192 Z" fill="url(#boxLeft)"/>
    <path d="M212 100 L276 130 L276 192 L212 162 Z" fill="url(#boxRight)"/>
    <path d="M148 130 L212 100 L276 130 L212 160 Z" fill="url(#boxTop)"/>
    <path d="M212 100 L212 160" stroke="url(#tape)" stroke-width="9" opacity="0.85"/>
    <!-- shipping label -->
    <g transform="translate(160 152) skewY(26)">
      <rect width="34" height="22" rx="2" fill="#f4efe4" opacity="0.9"/>
      <rect x="3" y="4" width="18" height="2.4" fill="#3a5060"/>
      <rect x="3" y="9" width="26" height="2" fill="#7b8b98"/>
      <rect x="3" y="13.5" width="14" height="2" fill="#7b8b98"/>
    </g>
  </g>

  <!-- small box -->
  <g>
    <path d="M292 158 L330 140 L368 158 L368 190 L330 208 L292 190 Z" fill="url(#boxLeft)" opacity="0.95"/>
    <path d="M330 140 L368 158 L368 190 L330 172 Z" fill="url(#boxRight)"/>
    <path d="M292 158 L330 140 L368 158 L330 176 Z" fill="url(#boxTop)"/>
    <path d="M330 140 L330 172" stroke="url(#tape)" stroke-width="6" opacity="0.8"/>
  </g>

  <!-- B2B badge -->
  <g transform="translate(452 54)">
    <rect width="96" height="34" rx="9" fill="#0e2a38" stroke="#2f7f97" stroke-width="1.2"/>
    <rect width="96" height="34" rx="9" fill="none" stroke="#7dd3fc" stroke-width="0.6" opacity="0.5"/>
    <text x="48" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4" fill="#a5e9ff">B2B</text>
  </g>

  <!-- truck silhouette -->
  <g opacity="0.5" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 78 h44 v26 h-44 z"/>
    <path d="M102 86 h18 l12 12 v6 h-30 z"/>
    <circle cx="74" cy="108" r="6"/>
    <circle cx="120" cy="108" r="6"/>
    <path d="M52 70 h56" stroke-dasharray="3 5"/>
  </g>

  <rect y="150" width="600" height="70" fill="url(#fade)" opacity="0.75"/>
</svg>
