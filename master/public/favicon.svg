  </defs>

  <!-- High-Contrast Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#scBg)" />
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- High-Velocity "S" Monogram Vector -->
  <path
